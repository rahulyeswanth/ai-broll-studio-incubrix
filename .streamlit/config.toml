# Dark base theme so every native Streamlit widget (labels, metrics, selects, buttons) is readable on the dark UI.
[theme]
base = "dark"
primaryColor = "#4F8CFF"
backgroundColor = "#0B0F1A"
secondaryBackgroundColor = "#121826"
textColor = "#E6EAF2"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
